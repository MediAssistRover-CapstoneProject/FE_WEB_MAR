services:
  simulator:
    build: .
    image: mar-gazebo-jazzy:local
    init: true
    environment:
      FE_ORIGIN: ${FE_ORIGIN:-http://localhost:5173}
      SIM_GUI: ${SIM_GUI:-true}
      ROS_DOMAIN_ID: "77"
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      SIM_MQTT_ENABLED: "true"
      SIM_ROBOT_ID: 9cd72e40-5778-4ee8-b5c3-e1030089e3a1
      MQTT_BROKER_URI: ${MQTT_BROKER_URI:?Use the existing BE .env with --env-file}
      MQTT_USERNAME: ${MQTT_USERNAME:?MQTT username required}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT password required}
    ports:
      - "127.0.0.1:8765:8765"
      - "127.0.0.1:6080:6080"
    volumes:
      - ../public/mock-map-4b43a4f2:/input:ro
      - ./:/app:ro
      - ./generated:/app/generated
    shm_size: 1gb
    stop_grace_period: 15s
